    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="../css/modern.css" rel="stylesheet">

<body>
    <!-- Navigation Bar -->

        <div class="navbar-container">
            <div class="logo">
                <a href="../index.html">

            <div class="nav-menu">

            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
